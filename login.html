<style>
  :root{
    --bg: #0e0f13; --panel: #16181f; --panel-2: #1c1f28; --border: #2a2d38;
    --text: #f2f3f5; --text-dim: #9298a8; --accent: #7c5cff; --accent-2: #2dd4bf; --danger: #ff5470;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg); color: var(--text);
    font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card{
    width:380px; max-width:100%; background:var(--panel); border:1px solid var(--border);
    border-radius:16px; padding:32px 28px;
  }
  .badge{
    width:44px; height:44px; border-radius:12px; margin-bottom:16px;
    background: linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  h1{font-size:19px; margin-bottom:6px;}
  p{font-size:13px; color:var(--text-dim); margin-bottom:22px;}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:14px; margin-bottom:14px;
  }
  button{
    width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700;
  }
  button:disabled{opacity:.6; cursor:default;}
  .error{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="badge">🔥</div>
    <h1>인기영상 대시보드</h1>
    <p>초대받은 사람만 사용할 수 있는 개인용 사이트입니다. 공유받은 비밀번호를 입력하세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호" autofocus>
    <button type="submit" id="loginBtn">입장하기</button>
    <div class="error" id="errorText"></div>
  </form>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const errEl = document.getElementById('errorText');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('passwordInput').value;
  if(!password) return;
  btn.disabled = true; btn.textContent = '확인 중...'; errEl.textContent = '';
  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password}),
    });
    const data = await res.json().catch(() => ({}));
    if(res.ok){
      location.href = '/index.html';
    } else {
      errEl.textContent = data.error || '로그인에 실패했습니다.';
    }
  }catch(e){
    errEl.textContent = '네트워크 오류: ' + e.message;
  }finally{
    btn.disabled = false; btn.textContent = '입장하기';
  }
});
</script>
</body>
</html>
